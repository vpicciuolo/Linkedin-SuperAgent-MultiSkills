name: Validate skill pack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate package
        run: python plugins/linkedin-superagent-multiskills/scripts/validate_pack.py
      - name: Run unit tests
        run: python -m unittest discover -s plugins/linkedin-superagent-multiskills/tests -v
