name: Build release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate package
        run: |
          python plugins/linkedin-superagent-multiskills/scripts/validate_pack.py
          python -m unittest discover -s plugins/linkedin-superagent-multiskills/tests -v
      - name: Build portable files
        run: python plugins/linkedin-superagent-multiskills/scripts/build_distribution.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "OYYO LinkedIn SuperAgent $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
